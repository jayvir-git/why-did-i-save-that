<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside the inator · visual specification</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8f8f5,#181a1c);--fg:light-dark(#252a2d,#e6e9e9);--muted:light-dark(#586269,#b0b8bd);--line:light-dark(#d4d9da,#41494e);--panel:light-dark(#ffffff,#202529);--selected:light-dark(#e8eef0,#304047);--accent:light-dark(#225d72,#92cee1);--proposal:light-dark(#795d23,#d7bc82);font:15px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px;text-align:left}button:hover{background:var(--selected)}button[aria-pressed=true],button[aria-current=page]{background:var(--selected);border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.55;cursor:default}a{color:var(--accent)}h1{font-size:24px;margin:8px 0}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 14px}small,.small{font-size:12px;color:var(--muted)}code{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}header{padding:28px 34px 20px;border-bottom:1px solid var(--line);max-width:1500px;margin:auto}.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}.header-bottom{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}.stats{font-size:13px;color:var(--muted)}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1500px;margin:auto}nav{padding:22px 16px;border-right:1px solid var(--line)}nav button{display:block;width:100%;margin-bottom:6px;border-color:transparent;background:transparent}nav .group{margin:18px 12px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}main{padding:28px 30px;min-width:0}.lede{max-width:850px;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr);gap:24px}.diagram{position:relative;min-width:0}.nodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:54px 35px;padding:20px 8px;position:relative}.node{position:relative;z-index:1;min-height:96px;display:flex;flex-direction:column;justify-content:center;padding:12px;background:var(--panel)}.node b{font-weight:600;font-size:14px}.node small{margin-top:7px}.node.proposed{border-style:dashed}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.wires path{fill:none;stroke:var(--line);stroke-width:1.5}.wires path.active{stroke:var(--accent);stroke-width:2}.wires text{fill:var(--fg);font-size:11px}.wires circle{fill:var(--panel);stroke:var(--line)}.detail{border-left:1px solid var(--line);padding-left:24px;min-width:0}.detail dl{margin:18px 0}.detail dt{font-size:12px;color:var(--muted);margin-top:12px}.detail dd{margin:3px 0 0}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}.tag.proposed{color:var(--proposal)}.gap{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.gap b{font-weight:600}.transitions{margin-top:14px}.transition{display:flex;gap:10px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.number{font:12px ui-monospace,monospace;color:var(--accent);min-width:20px}.decision-links{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.decision-links button{font-size:12px;padding:5px 9px}.rule{border-top:1px solid var(--line);padding:20px 0}.rule header{padding:0;border:0}.rule p{max-width:920px}.source{display:flex;flex-direction:column;gap:5px;margin:12px 0}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filters input{flex:1;min-width:190px}.filters input,.filters select{border:1px solid var(--line);padding:9px;background:var(--panel);border-radius:4px}.empty{padding:24px 0;color:var(--muted)}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}.proposal-row{display:grid;grid-template-columns:65px minmax(0,1fr);gap:15px;padding:24px 0;border-top:1px solid var(--line)}.scenario-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:25px;margin-top:24px}.scenario-menu button{display:block;width:100%;margin-bottom:7px}.step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.step.active{background:var(--selected)}.controls{display:flex;gap:10px;margin:20px 0}.op{border-top:1px solid var(--line);padding:18px 0}.op-title{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.op p{margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;padding:12px;background:var(--panel)}.inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.inventory div{padding:12px 0;border-top:1px solid var(--line)}footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.scope-list{padding-left:20px}.skip{position:absolute;top:-80px}.skip:focus{top:4px;background:var(--panel);padding:8px;z-index:10}
@media(max-width:1150px){.split{grid-template-columns:1fr}.detail{border-left:0;border-top:1px solid var(--line);padding:20px 0}.nodes{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{grid-template-columns:200px minmax(0,1fr)}}
@media(max-width:750px){header{padding:20px}.shell{display:block}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:7px;padding:12px}nav .group{display:none}nav button{width:auto;flex-shrink:0;margin:0;font-size:13px}main{padding:20px}.nodes{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 20px}.scenario-layout{grid-template-columns:1fr}.scenario-menu{display:flex;overflow:auto;gap:8px}.scenario-menu button{width:200px;flex-shrink:0}.inventory{grid-template-columns:1fr}.proposal-row{grid-template-columns:1fr;gap:5px}}
@media print{nav,.filters,.controls{display:none}.shell,.split{display:block}.node{break-inside:avoid}main{padding:0}.detail{border:0;padding:20px 0}.wires{display:none}}
</style></head><body>
<a class="skip" href="#main">Skip to specification</a>
<header><div class="kicker">Behavior atlas · code-linked · 24 September 2026</div><h1>Inside the inator</h1><p>Follow the work. Inspect the decisions. Find what the app cannot know.</p><div class="header-bottom"><span class="stats" id="counts"></span><span class="small">Implemented = observed code · Proposed = not shipped · Unknown = missing observation</span></div></header>
<div class="shell"><nav aria-label="Specification sections" id="nav"></nav><main id="main" tabindex="-1"></main></div>
<script id="spec-data" type="application/json">__SPEC_DATA__</script>
<script>
'use strict';
const spec=JSON.parse(document.getElementById('spec-data').textContent);
const main=document.getElementById('main'), nav=document.getElementById('nav');
const rules=new Map(spec.decisions.map(d=>[d.id,d]));
let section='reviews', selectedNode='', selectedScenario=0, step=0, resize=null;
const h=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const button=(label,fn,cls)=>{const n=h('button',label,cls);n.type='button';n.onclick=fn;return n;};
function source(ref,label){const n=h('div',undefined,'source');n.append(h('small',label),h('code',ref.path+':'+ref.line),h('small',ref.anchor));return n;}
function links(ids){const n=h('div',undefined,'decision-links');for(const id of ids)n.append(button(id+' · '+rules.get(id).title,()=>showRegister(id)));return n;}
function foot(){const f=h('footer');f.append(h('p',spec.scope),h('code','Regenerate: python scripts/build_visual_spec.py · Verify drift: python scripts/build_visual_spec.py --check'));main.append(f);}
function title(name,description){main.append(h('h2',name),h('p',description,'lede'));}
function setNav(){for(const n of nav.querySelectorAll('button')){if(n.dataset.section===section)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');}}
function navigate(value){section=value;selectedNode='';history.replaceState(null,'','#'+value);render();}
nav.append(h('div','System maps','group'));
for(const g of spec.diagrams){const b=button(g.title,()=>navigate(g.id));b.dataset.section=g.id;nav.append(b);}
nav.append(h('div','Inspect and decide','group'));
for(const [id,label] of [['decisions','Decision register'],['scenarios','Failure walkthroughs'],['improvements','Implementation status'],['catalog','API boundary'],['coverage','Scope & coverage']]){const b=button(label,()=>navigate(id));b.dataset.section=id;nav.append(b);}
document.getElementById('counts').textContent=`${spec.diagrams.length} maps / ${spec.decisions.length} decisions / ${spec.operations.length} operations / ${spec.scenarios.length} walkthroughs`;
function ruleDetail(d){const n=h('article',undefined,'rule');n.id=d.id;n.append(h('span',d.id+' · '+d.area+' · '+d.status,'tag'),h('h3',d.title),h('p',d.rule),h('small','Consequence'),h('p',d.consequence),h('small','Acceptance example'),h('p',d.acceptance),source(d.source,'Implementation evidence'));
if(d.test)n.append(source(d.test,'Related automated test — may cover only part of this rule'));
else n.append(h('p','Code inspection only; no specific automated test mapped here.','small'));
const rationale=h('details');rationale.append(h('summary','What do we know about the rationale?'),h('p',d.rationale));n.append(rationale);return n;}
function showRegister(id){section='decisions';history.replaceState(null,'','#decisions');render();document.getElementById('rule-search').value=id;document.getElementById('rule-search').dispatchEvent(new Event('input'));}
function graphView(g){title(g.title,g.question);const split=h('div',undefined,'split'), left=h('div'), board=h('div',undefined,'diagram'), grid=h('div',undefined,'nodes'), detail=h('aside',undefined,'detail');detail.setAttribute('aria-label','Selected state details');
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','wires');svg.setAttribute('aria-hidden','true');board.append(svg,grid);left.append(board);split.append(left,detail);main.append(split);
if(!g.nodes.some(n=>n.id===selectedNode))selectedNode=g.nodes[0].id;
const buttons=new Map();for(const node of g.nodes){const b=button('',()=>{selectedNode=node.id;update();},'node '+(node.status==='Proposed'?'proposed':''));b.dataset.node=node.id;b.append(h('b',node.label),h('small',node.status+' · '+(node.decisions.join(', ')||'Not implemented')));grid.append(b);buttons.set(node.id,b);}
const transitions=h('div',undefined,'transitions');left.append(transitions);
function draw(){const root=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${root.width} ${root.height}`);svg.replaceChildren();const NS='http://www.w3.org/2000/svg';
 const defs=document.createElementNS(NS,'defs');for(const [id,color] of [['arrow','var(--line)'],['active-arrow','var(--accent)']]){const mark=document.createElementNS(NS,'marker');for(const [k,v] of Object.entries({id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'}))mark.setAttribute(k,v);const p=document.createElementNS(NS,'path');p.setAttribute('d','M 0 0 L 10 5 L 0 10 z');p.style.fill=color;p.style.stroke='none';mark.append(p);defs.append(mark);}svg.append(defs);
 g.edges.forEach((e,i)=>{const a=buttons.get(e.source).getBoundingClientRect(),b=buttons.get(e.target).getBoundingClientRect();const sameRow=Math.abs(b.top-a.top)<5,down=b.top>a.top+5,right=b.left>a.left;const x1=(sameRow?(right?a.right:a.left):a.left+a.width/2)-root.left,y1=(sameRow?a.top+a.height/2:down?a.bottom:a.top)-root.top,x2=(sameRow?(right?b.left:b.right):b.left+b.width/2)-root.left,y2=(sameRow?b.top+b.height/2:down?b.top:b.bottom)-root.top;const bend=down?22:-22;const active=e.source===selectedNode||e.target===selectedNode;const p=document.createElementNS(NS,'path');p.setAttribute('d',sameRow?`M${x1},${y1} L${x2},${y2}`:`M${x1},${y1} C${x1},${y1+bend} ${x2},${y2-bend} ${x2},${y2}`);if(active)p.setAttribute('class','active');p.setAttribute('marker-end',`url(#${active?'active-arrow':'arrow'})`);svg.append(p);if(active){const x=(x1+x2)/2,y=(y1+y2)/2;const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','9');const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y+4);t.setAttribute('text-anchor','middle');t.textContent=i+1;svg.append(c,t);}});
}
function update(){for(const [id,b] of buttons)b.setAttribute('aria-pressed',String(id===selectedNode));const node=g.nodes.find(n=>n.id===selectedNode);detail.replaceChildren(h('span',node.status,'tag '+(node.status==='Proposed'?'proposed':'')),h('h3',node.label));const dl=h('dl');for(const [k,v] of [['Owner',node.owner],['Retained state',node.persisted]])dl.append(h('dt',k),h('dd',v));detail.append(dl,links(node.decisions));for(const id of node.decisions){const d=rules.get(id);detail.append(h('p',d.rule),source(d.source,'Code reference'));}const gap=h('div',undefined,'gap');gap.append(h('small','Gap / observation boundary'),h('p',g.gap));detail.append(gap);
 transitions.replaceChildren(h('h3','Transitions touching this state'));g.edges.forEach((e,i)=>{if(e.source!==selectedNode&&e.target!==selectedNode)return;const row=h('div',undefined,'transition');row.append(h('span',String(i+1),'number'),h('span',g.nodes.find(n=>n.id===e.source).label+' → '+g.nodes.find(n=>n.id===e.target).label+' · '+e.label));transitions.append(row);});requestAnimationFrame(draw);}
update();resize=new ResizeObserver(draw);resize.observe(board);foot();}
function register(){title('Decision register','Observed rules, consequences and acceptance examples. Search any phrase or decision ID; test links indicate relevant coverage, not complete proof.');const filters=h('div',undefined,'filters'), search=h('input'), area=h('select');search.id='rule-search';search.type='search';search.placeholder='Find a decision, term or ID';search.setAttribute('aria-label','Search decisions');area.setAttribute('aria-label','Filter decision area');for(const value of ['All areas',...new Set(spec.decisions.map(d=>d.area))]){const o=h('option',value);o.value=value;area.append(o);}filters.append(search,area);const results=h('div');main.append(filters,results);function update(){const q=search.value.toLowerCase();const shown=spec.decisions.filter(d=>(area.value==='All areas'||d.area===area.value)&&JSON.stringify(d).toLowerCase().includes(q));results.replaceChildren(h('p',shown.length+' matching decisions','small'));for(const d of shown)results.append(ruleDetail(d));if(!shown.length)results.append(h('p','No matching decision. Clear the search or choose another area.','empty'));}search.oninput=update;area.onchange=update;update();foot();}
function scenarios(){title('Failure walkthroughs','These are explanations of current behavior, not live requests or simulated provider connections.');const wrap=h('div',undefined,'scenario-layout'), menu=h('div',undefined,'scenario-menu'), body=h('div');for(const [i,s]of spec.scenarios.entries()){const b=button(s.title,()=>{selectedScenario=i;step=0;scenariosRender();});b.setAttribute('aria-pressed',String(i===selectedScenario));menu.append(b);}wrap.append(menu,body);main.append(wrap);function update(){const s=spec.scenarios[selectedScenario];body.replaceChildren(h('span',s.id,'tag'),h('h3',s.title));s.steps.forEach((text,i)=>{const row=h('div',undefined,'step'+(i===step?' active':''));row.setAttribute('aria-current',i===step?'step':'false');row.append(h('span',String(i+1),'number'),h('span',text));body.append(row);});const controls=h('div',undefined,'controls'),back=button('Previous',()=>{step--;update();}),next=button('Next',()=>{step++;update();});back.disabled=step===0;next.disabled=step===s.steps.length-1;controls.append(back,next);body.append(controls,h('p',s.conclusion),links(s.decisions));}update();foot();}
function scenariosRender(){main.replaceChildren();scenarios();}
function improvements(){title('Improvement implementation status','Implemented changes, acceptance criteria and remaining limits. Follow the linked decisions to inspect their current contracts.');for(const g of spec.gaps){const row=h('article',undefined,'proposal-row'),body=h('div');row.append(h('span',g.priority,'tag proposed'),body);body.append(h('small',g.id+' · '+g.status),h('h3',g.title),h('small','Previous gap'),h('p',g.problem),h('small','Implemented'),h('p',g.proposal),h('small','Remaining limits'),h('p',g.remaining),h('small','Acceptance criterion'),h('p',g.acceptance),links(g.decisions));main.append(row);}foot();}
function catalogView(){title('API boundary',`${spec.operations.length} catalog operations. ${spec.operations.filter(o=>o.web).length} are permitted by the web API; this does not mean each has a UI control. All are available through the shared local CLI/MCP catalog.`);const filters=h('div',undefined,'filters'),search=h('input'),select=h('select');search.placeholder='Find an operation';search.setAttribute('aria-label','Search operations');select.setAttribute('aria-label','API surface');for(const [v,t]of [['all','All operations'],['web','Web allowlist'],['external','CLI / MCP only']]){const o=h('option',t);o.value=v;select.append(o);}filters.append(search,select);const results=h('div');main.append(filters,results);function update(){const ops=spec.operations.filter(o=>(select.value==='all'||o.web===(select.value==='web'))&&(o.name+' '+o.description).toLowerCase().includes(search.value.toLowerCase()));results.replaceChildren(h('p',ops.length+' operations','small'));for(const o of ops){const row=h('article',undefined,'op'),top=h('div',undefined,'op-title');top.append(h('code',o.name),h('span',o.web?'Web + CLI/MCP':'CLI/MCP only','tag'));row.append(top,h('p',o.description),source(o.source,'Implementation'));const details=h('details');details.append(h('summary','Exact parameter contract'),h('pre',JSON.stringify(o.parameters,null,2)));row.append(details);results.append(row);}}search.oninput=update;select.onchange=update;update();foot();}
function coverage(){title('Scope, evidence and limits','This is a reviewable model of the application, not a claim that all ambiguity has disappeared.');main.append(h('p',spec.scope));const list=h('ul',undefined,'scope-list');for(const item of spec.omissions)list.append(h('li',item));main.append(list,h('h3','What is mechanically checked'),h('p','Every decision source anchor exists. Every mapped test anchor exists. Diagram endpoints and decision references are valid. The full shared operation catalog is enumerated. Generated outputs carry source fingerprints; --check detects drift. These checks cannot decide whether a description is semantically correct.'),h('h3','Coverage inventory'),h('p',`${spec.decisions.filter(d=>d.test).length} of ${spec.decisions.length} decisions have a related automated test mapped; the rest currently rely on code inspection. This is mapping coverage, not test coverage.`));
const details=h('details');details.append(h('summary',`${spec.controls.length} static controls with IDs in the app shell`));const inv=h('div',undefined,'inventory');for(const c of spec.controls){const n=h('div');n.append(h('code',c.id),h('small',' · '+c.element),source(c.source,'Shell definition'));inv.append(n);}details.append(inv);main.append(details);
const files=h('details');files.append(h('summary',Object.keys(spec.fingerprints).length+' fingerprinted source/test files'));for(const [p,digest]of Object.entries(spec.fingerprints)){files.append(h('p',p),h('code','SHA-256 '+digest));}main.append(files,h('h3','How to maintain this specification'),h('p','Update the decision register when behavior changes. Regenerate the JSON, Markdown and interactive view. Re-run --check and the linked acceptance tests. If a decision lacks a known reason, keep the reason unknown instead of inventing one.'));foot();}
function render(){if(resize){resize.disconnect();resize=null;}main.replaceChildren();setNav();const graph=spec.diagrams.find(g=>g.id===section);if(graph)graphView(graph);else if(section==='decisions')register();else if(section==='scenarios')scenarios();else if(section==='improvements')improvements();else if(section==='catalog')catalogView();else coverage();}
const requested=location.hash.slice(1);if([...spec.diagrams.map(g=>g.id),'decisions','scenarios','improvements','catalog','coverage'].includes(requested))section=requested;
render();
</script></body></html>
